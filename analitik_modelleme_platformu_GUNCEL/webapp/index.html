<!-- lang="tr" ZORUNLU. Uç yazılar CSS ile büyütülür
     (text-transform: uppercase) ve tarayıcı bu dönüşümü dile göre
     yapar: Türkçede i → İ, ı → I. Dataiku sayfa kabuğunu kendisi
     üretip <html> etiketini bize bırakmadığı için dil en dıştaki
     kendi kabımıza yazılır; en yakın lang geçerli olduğundan bu
     yeterlidir. -->
<div id="kabuk" lang="tr">

  <!-- ===================== SOL BAR =====================
       En üstte robotlu kurum görseli, altında sayfa kümeleri (Model Platformu,
       Sohbet, Dashboard), en altta Renk Modu, Arşiv ve Yeni Çalışma. Üst
       bar yok: sol bar tam boyda; sayfalar sağında açılır. -->
  <aside id="sol-bar">

    <!-- ÖLÇEKLİ İÇ KAP: sol barın bütün içeriği; kaydırma YOK. Kap,
         barın yüksekliğine sığacak oranda büyütülüp küçültülür
         (app.js: solBarOlcekle). -->
    <div id="sol-bar-ic">
    <!-- LOGO: en üstte robotlu kurum görseli (barın eninde), altında
         siyah alt başlık yazısı (koyu temada beyaz). Görsel yüklenemezse
         gizlenir, yazı kalır (app.js). -->
    <div id="sol-bar-logo">
      <img id="banner" alt="">
      <div id="sol-bar-aciklama">Bireysel Krediler Analitik ve Tahsis BI</div>
    </div>

    <!-- SAYFA KÜMELERİ (sol barda alt alta).
         MODEL PLATFORMU kümesi: MODEL AKIŞI (iş akışı + adım kartları), GENEL
         BAKIŞ (çalışma düzeyi: veri seti, sözlük, değişken sayıları, bölme,
         validasyon, model sonucu), DEĞİŞKENLER (kendi seçim paneliyle: Veri ve
         Sözlük, Dağılım ve SFA, Değişken Kontrolleri) ve ÖZET (doküman). İki analiz kutusu .analiz-sekme
         sınıfını taşır: sekme mantığı (aktif, çizim) o sınıfa bağlı.
         SOHBET ve DASHBOARD ayrı bloklar; içerikleri hazırlanana kadar
         KAPALI (.kapali: gri, kilitli, tıklanmaz). Açılınca .kapali sınıfı
         kaldırılır, kendi sayfalarına geçer (app.js: sayfaAc). -->
    <nav id="ust-sekmeler" aria-label="Sayfalar">
      <div class="ust-kume">
        <span class="ust-kume-ad"><svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l8 4.5v9l-8 4.5-8-4.5V7z"></path><path d="M4 7l8 4.5L20 7M12 11.5V21"></path></svg>MODEL PLATFORMU</span>
        <button class="ust-sekme" data-ust="akis" type="button"><svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><path d="M6.5 10v4a3 3 0 0 0 3 3H14"></path></svg>MODEL AKIŞI<svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
        <button class="ust-sekme analiz-sekme" data-tab="ozet" type="button"><svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 17.5a9 9 0 1 1 17 0"></path><path d="M12 13.5l4.5-4.5"></path><circle cx="12" cy="13.5" r="1.3"></circle><path d="M3 20.5h18"></path></svg>GÖSTERGE PANELİ<svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
        <button class="ust-sekme analiz-sekme" data-tab="degisken" type="button"><svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>DEĞİŞKENLER<svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
        <button class="ust-sekme" data-ust="dokuman" type="button"><svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h6"></path></svg>ÖZET<svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
        <!-- KATIB'LE SOHBET (model platformu içi): içerik hazırlanana kadar kilitli. -->
        <button class="ust-sekme kapali" data-ust="model_sohbet" type="button" aria-disabled="true"
                title="KATIB'le Sohbet henüz kapalı: hazırlanıyor"><svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>KATIB'LE SOHBET<svg class="kilit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></button>
      </div>
      <div class="ust-kume tekli">
        <button class="ust-sekme kapali" data-ust="sohbet" type="button" aria-disabled="true"
                title="KATIB'le Sohbet henüz kapalı: hazırlanıyor"><svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>KATIB'LE SOHBET<svg class="kilit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></button>
      </div>
      <div class="ust-kume tekli">
        <button class="ust-sekme kapali" data-ust="dashboard" type="button" aria-disabled="true"
                title="Gösterge Paneli henüz kapalı: hazırlanıyor"><svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>GÖSTERGE PANELİ<svg class="kilit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></button>
      </div>
    </nav>

    <div id="sol-bar-alt">
      <!-- ALT: Görünüm Ayarları, Arşiv ve Yeni Çalışma alt alta. -->
      <div class="sol-bar-dugmeler">
        <!-- Dataiku'nun kendi REFRESH düğmesiyle karışmaması için yalnız
             ikon değil, görünür etiket de taşır.
             İKON NEDEN SVG, KARAKTER DEĞİL: ⟳ / ↻ gibi karakterler fonttan
             fonta değişir (bazı sistemlerde tek oklu, bazılarında kutu
             çıkar). SVG her ortamda aynı çizilir.
             TEK OKLU: sohbet metninde geçen "sol alttaki ⟳ Yeni Çalışma"
             ifadesindeki karakterle aynı biçimdedir.
             stroke/fill currentColor: düğmenin rengini izler. -->
        <!-- ARŞİV: PROJE_HAFIZASI'ndaki kayıtlı çalışmalar. Birine basınca
             o çalışma kaldığı yerden açılır (app.js: calismalarAc). -->
        <!-- RENK MODU: açık (güneş) / koyu (ay); seçim hatırlanır
             (app.js: temaUygula). -->
        <button id="tema-btn" type="button" title="Koyu moda geç" aria-pressed="false">
          <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.5-1.6 0-.5-.2-.9-.5-1.2-.3-.4-.5-.8-.5-1.3 0-1 .8-1.7 1.7-1.7H16a5 5 0 0 0 5-5c0-4-4-7.2-9-7.2z"></path><circle cx="7.5" cy="11.5" r="1"></circle><circle cx="10" cy="7.5" r="1"></circle><circle cx="15" cy="7.5" r="1"></circle></svg><span class="sifirla-etiket">Renk Modu</span>
          <span class="tema-anahtar" aria-hidden="true"><span class="tema-gunes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg></span><span class="tema-ay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 13.5A8.5 8.5 0 1 1 10.5 3.5a6.5 6.5 0 0 0 10 10z"></path></svg></span></span>
        </button>
        <div id="calismalar-kap">
          <button id="calismalar-btn" type="button"
                  title="Kayıtlı çalışmalarınız: açın ya da silin" aria-haspopup="true"
                  aria-expanded="false" aria-controls="calismalar-liste">
            <svg class="sifirla-ikon" viewBox="0 0 16 16" aria-hidden="true"
                 focusable="false">
              <path d="M1.75 4.25v8a1 1 0 0 0 1 1h10.5a1 1 0 0 0 1-1v-6.5a1 1 0 0 0-1-1H8L6.5 3.25H2.75a1 1 0 0 0-1 1z"
                    fill="none" stroke="currentColor" stroke-width="1.45"
                    stroke-linejoin="round"/>
            </svg>
            <span class="sifirla-etiket">Arşiv</span>
            <svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
          <div id="calismalar-liste" role="menu" hidden></div>
        </div>
        <!-- Yeni Çalışma ONAYSIZ: basınca yeni çalışma açılır; açık çalışma
             silinmez, Arşiv'den geri açılır. -->
        <div id="yeni-kap">
        <button id="sifirla-btn" type="button"
                title="Yeni Çalışma (mevcut çalışma silinmez, Arşiv'den geri açılır)"
                aria-label="Yeni Çalışma (mevcut çalışma silinmez)">
          <svg class="sifirla-ikon" viewBox="0 0 16 16" aria-hidden="true"
               focusable="false">
            <path d="M12.532 5.887 A5 5 0 1 1 9.294 3.170"
                  fill="none" stroke="currentColor" stroke-width="1.45"
                  stroke-linecap="round"/>
            <polygon points="10.550,3.507 7.662,4.234 8.414,1.432"
                     fill="currentColor"/>
          </svg>
          <span class="sifirla-etiket">Yeni Çalışma</span>
        </button>
        </div>
      </div>
    </div>
    </div>
  </aside>

  <!-- ===================== SAYFA 1: ÇALIŞMA ===================== -->
  <div id="sayfa-calisma" class="sayfa">

    <!-- ORTA ALAN. Üstte İŞ AKIŞI BARI (Jupyter defterindeki menü çubuğu
         gibi): solda "İş Akışı" düğmesi, yanında bulunulan faz ve adım,
         sağda ilerleme. Düğmeye basınca iş akışı (beş faz ve adımları)
         barın altında, solda bölme olarak açılır ve kapatılana kadar açık
         kalır (app.js: akisMenuAc). Süreç açıklaması 01.1 Başlangıç
         Seçimi metnindedir. -->
    <main id="sohbet-alani">
      <div id="akis-bar">
        <div id="akis-menu">
          <button id="akis-btn" type="button" aria-expanded="false" aria-controls="panel"
                  title="İş akışını göster"><svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><path d="M6.5 10v4a3 3 0 0 0 3 3H14"></path></svg><span>İş Akışı</span><svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        </div>
        <div id="akis-konum" aria-live="polite"></div>
        <div id="akis-ilerleme"></div>
      </div>
      <!-- İŞ AKIŞI BÖLMESİ (Jupyter'deki gezinme bölmesi gibi): barın
           altından alanın en altına kadar solda durur, sohbet sağa kayar.
           Açık kalır; bardaki İş Akışı düğmesiyle açılıp kapanır. Seçim
           tarayıcıda hatırlanır. -->
      <aside id="panel" aria-label="İş akışı">
        <section id="is-akisi-blok" class="panel-blok">
          <div id="faz-listesi"></div>
        </section>
      </aside>
      <div id="sohbet" role="log" aria-live="polite" aria-relevant="additions text"></div>

      <!-- Onay düğmeleri blokların içindedir (app.js: blokBasligiEkle /
           blokOnayEkle); her blok kendi kararını taşır, sağ üstündeki
           Geri Dön o adıma döner. -->
      <div id="giris-bolge">
        <div id="giris">
          <textarea id="kutu" rows="1" placeholder="Cevabınızı ya da sorunuzu yazın"></textarea>
          <button id="gonder" type="button">Gönder</button>
        </div>
      </div>
    </main>


    <aside id="analiz-panel">
      <!-- DEĞİŞKENLER SEÇİM ŞERİDİ: yalnız DEĞİŞKENLER sekmesinde görünür.
           Hep kapalı (açılmaz): ince şeritte üç dikey düğme; basılan görünüm
           sağda açılır (app.js: dgAc). -->
      <aside id="dg-panel" hidden aria-label="Değişkenler görünümleri">
        <button class="dg-dikey" type="button" data-alt="veri">VERİ VE SÖZLÜK</button>
        <button class="dg-dikey" type="button" data-alt="dagilim">DAĞILIM VE SFA</button>
        <button class="dg-dikey" type="button" data-alt="kontrol">DEĞİŞKEN KONTROLLERİ</button>
      </aside>
      <!-- ANALİZ ALANI: sol bardaki GÖSTERGE PANELİ / DEĞİŞKENLER
           sekmelerinden biri seçilince sol barın sağındaki
           bütün alanı kaplar (style.css: #analiz-panel).
           AKIŞ'a basınca yukarı kapanır. -->

      <!-- İÇERİK: açık sekmenin gövdesi. Blok kapalıyken gizli. -->
      <div id="analiz-icerik">
        <div id="analiz-govde"></div>

        <!-- Sözlük teyidi adımında panelin ALTINDA duran ikinci birincil
             düğme: kullanıcı değişken listesini burada gözden geçiriyor,
             onay için sohbete dönmek zorunda kalmamalı. Sohbetteki kartla
             AYNI düğmedir; biri basılınca ikisi de kilitlenir. -->
        <div id="analiz-alt" hidden>
          <button id="analiz-teyit" class="secim-onay" type="button"></button>
          <!-- SFA: kararlar bu alanda verildiği için "Kararları Onayla"
               burada da var; sohbetteki kartın düğmesine basar
               (app.js: analizAltGuncelle). -->
          <button id="analiz-sfa-onay" class="secim-onay" type="button" hidden></button>
        </div>
      </div>
    </aside>

  </div>

  <!-- ===================== SOHBET ve DASHBOARD =====================
       Sol bardaki ayrı bloklar. İçerikleri ayrıca kurulacak; şimdilik
       yalnız sayfa iskeleti. -->
  <div id="sayfa-sohbet" class="sayfa gizli">
    <div class="bos-sayfa">
      <div class="bos-sayfa-ad">KATIB'le Sohbet</div>
      <div class="bos-sayfa-not">Bu bölüm hazırlanıyor.</div>
    </div>
  </div>
  <div id="sayfa-dashboard" class="sayfa gizli">
    <div class="bos-sayfa">
      <div class="bos-sayfa-ad">Gösterge Paneli</div>
      <div class="bos-sayfa-not">Bu bölüm hazırlanıyor.</div>
    </div>
  </div>

  <!-- ===================== SAYFA 2: MODEL GELİŞTİRME DOKÜMANI =====
       Model Risk'e giden doküman: künye + 20 numaralı bölüm + ek,
       kullanıcı düzenlemesi ve Word çıktısı. Gövde /dokuman ucundan gelir; başlık,
       tarih ve teslim damgası da oradan yazılır, burada sabit metin yok. -->
  <div id="sayfa-ozet" class="sayfa gizli">
    <div id="ozet-govde">
      <div class="dok-serit">
        <div class="dok-serit-sol">
          <!-- Damga başlığın YANINDA: dokümanı açan ilk bakışta taslak mı
               final mi olduğunu görmeli. Kapı etikettedir, hiçbir eylemi
               kapatmaz (bkz. dok-word her durumda etkin). -->
          <div class="dok-baslik-satir">
            <h1 id="dok-baslik" class="dok-baslik"></h1>
            <span id="dok-damga" class="dok-damga" hidden></span>
          </div>
          <div id="dok-tarih" class="dok-tarih"></div>
        </div>
        <!-- Her durumda etkin: eksik bölümler dosyada "—" olarak görünür,
             yarım dokümanı indirebilmek kullanıcının hakkı. -->
        <button id="dok-word" class="dok-dugme" type="button">Word Olarak İndir</button>
      </div>

      <!-- İndirme hatası: dosya inmezse burada gösterilir -->
      <div id="dok-indirme-hata" class="dok-hata" role="alert" hidden></div>

      <!-- Bloker · eksik · kısmi sayacı. Bloker varsa kırmızı, yalnız
           eksik/kısmi varsa amber, hiçbiri yoksa gizli. -->
      <div id="dok-uyari" class="dok-uyari" hidden></div>

      <div id="dok-bolumler"></div>
    </div>
  </div>

  <!-- Dar ekranda açılan çekmecelerin arka perdesi -->
  <div id="cekmece-perde" hidden></div>

</div>
